<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">How to photograph an open picture book</title>
  <desc id="desc">A phone frames both pages of an illustrated twilight meadow. The text reads: Through the meadow, soft and slow, little fireflies start to glow.</desc>
  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9ef"/>
      <stop offset="1" stop-color="#f1e4d1"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7086a8"/>
      <stop offset=".58" stop-color="#a6a6b8"/>
      <stop offset="1" stop-color="#e6b98e"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#536f69"/>
      <stop offset="1" stop-color="#263f3e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#594a3c" flood-opacity=".2"/>
    </filter>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="pages">
      <path d="M222 181 Q471 130 742 190 L742 755 Q482 706 222 755Z"/>
      <path d="M794 190 Q1065 130 1314 181 L1314 755 Q1054 706 794 755Z"/>
    </clipPath>
    <clipPath id="screen">
      <rect x="318" y="278" width="900" height="506" rx="55"/>
    </clipPath>
  </defs>

  <rect width="1536" height="1024" fill="url(#table)"/>
  <ellipse cx="768" cy="795" rx="610" ry="96" fill="#8f7254" opacity=".12"/>

  <g filter="url(#shadow)">
    <path d="M205 164 Q470 112 765 174 V779 Q475 722 205 779Z" fill="#fffdf7" stroke="#c9b89f" stroke-width="8"/>
    <path d="M771 174 Q1066 112 1331 164 V779 Q1061 722 771 779Z" fill="#fffdf7" stroke="#c9b89f" stroke-width="8"/>
  </g>
  <g clip-path="url(#pages)">
    <rect x="210" y="135" width="1120" height="620" fill="url(#sky)"/>
    <path d="M180 540 Q360 430 535 530 T870 510 T1370 520 V800 H180Z" fill="#66777d" opacity=".65"/>
    <path d="M170 596 Q386 484 600 585 T1010 560 T1380 590 V820 H170Z" fill="#405f5c"/>
    <rect x="180" y="610" width="1200" height="220" fill="url(#meadow)"/>
    <g stroke="#9bb08a" stroke-width="6" stroke-linecap="round" opacity=".72">
      <path d="M255 755q10-90 50-135M336 770q0-80-37-116M418 760q8-106 58-150M1115 765q-5-95-51-143M1210 758q2-82 42-130M1008 770q-2-88 32-141"/>
    </g>
    <g fill="#ffd46f">
      <circle cx="298" cy="624" r="9"/><circle cx="382" cy="678" r="7"/><circle cx="478" cy="602" r="8"/>
      <circle cx="576" cy="689" r="7"/><circle cx="688" cy="624" r="9"/><circle cx="856" cy="676" r="8"/>
      <circle cx="961" cy="610" r="7"/><circle cx="1077" cy="687" r="9"/><circle cx="1175" cy="617" r="8"/>
      <circle cx="1260" cy="670" r="7"/>
    </g>
    <g fill="#ffe39a" opacity=".28" filter="url(#glow)">
      <circle cx="298" cy="624" r="28"/><circle cx="478" cy="602" r="25"/><circle cx="688" cy="624" r="28"/>
      <circle cx="961" cy="610" r="25"/><circle cx="1077" cy="687" r="28"/><circle cx="1175" cy="617" r="25"/>
    </g>
  </g>

  <g fill="#293b3b" font-family="'Avenir Next Rounded','Avenir Next','Nunito Sans',ui-rounded,sans-serif" font-weight="600" text-anchor="middle">
    <text x="480" y="290" font-size="39">Through the meadow,</text>
    <text x="480" y="340" font-size="39">soft and slow,</text>
    <text x="1055" y="290" font-size="39">little fireflies</text>
    <text x="1055" y="340" font-size="39">start to glow.</text>
  </g>

  <path d="M768 174 Q756 460 768 779" fill="none" stroke="#b6a58e" stroke-width="13" opacity=".78"/>
  <path d="M768 185 Q748 454 768 768" fill="none" stroke="#fffdf8" stroke-width="4" opacity=".9"/>

  <g>
    <rect x="286" y="246" width="964" height="570" rx="76" fill="#252a2b" stroke="#111515" stroke-width="9"/>
    <rect x="318" y="278" width="900" height="506" rx="55" fill="#f9f4ea"/>
    <g clip-path="url(#screen)">
      <g transform="translate(368 315) scale(.52)">
        <rect x="-12" y="-20" width="1120" height="620" fill="url(#sky)"/>
        <path d="M-20 400 Q160 290 335 390 T670 370 T1170 380 V660 H-20Z" fill="#66777d" opacity=".65"/>
        <path d="M-30 456 Q186 344 400 445 T810 420 T1180 450 V680 H-30Z" fill="#405f5c"/>
        <rect x="-20" y="470" width="1200" height="210" fill="url(#meadow)"/>
        <path d="M548-20V590" stroke="#d5c5ae" stroke-width="18"/>
        <g fill="#293b3b" font-family="'Avenir Next Rounded','Avenir Next','Nunito Sans',ui-rounded,sans-serif" font-weight="600" text-anchor="middle">
          <text x="260" y="118" font-size="40">Through the meadow,</text>
          <text x="260" y="168" font-size="40">soft and slow,</text>
          <text x="835" y="118" font-size="40">little fireflies</text>
          <text x="835" y="168" font-size="40">start to glow.</text>
        </g>
        <g fill="#ffd46f">
          <circle cx="80" cy="490" r="12"/><circle cx="215" cy="530" r="9"/><circle cx="400" cy="475" r="11"/>
          <circle cx="695" cy="512" r="11"/><circle cx="872" cy="474" r="10"/><circle cx="1040" cy="530" r="12"/>
        </g>
      </g>
      <path d="M368 315 Q505 288 654 320 V749 Q511 716 368 749Z" fill="none" stroke="#f9f5ea" stroke-width="7"/>
      <path d="M658 320 Q807 288 944 315 V749 Q801 716 658 749Z" fill="none" stroke="#f9f5ea" stroke-width="7"/>
    </g>
    <rect x="726" y="260" width="84" height="9" rx="4.5" fill="#596061"/>
    <circle cx="1182" cy="532" r="18" fill="none" stroke="#596061" stroke-width="5"/>
  </g>

  <g fill="none" stroke="#cf5f52" stroke-width="11" stroke-linecap="round">
    <path d="M335 342v-30q0-18 18-18h30"/>
    <path d="M1185 342v-30q0-18-18-18h-30"/>
    <path d="M335 720v30q0 18 18 18h30"/>
    <path d="M1185 720v30q0 18-18 18h-30"/>
  </g>
</svg>
